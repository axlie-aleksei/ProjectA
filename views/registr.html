<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация | Anime Stream</title>
  <link rel="stylesheet" href="../public/css/style.css">
</head>
<body class="auth-page">

<main class="auth-layout">
  <a class="auth-logo" href="index.html">Anime Stream</a>

  <form class="auth-card">
    <h1>Регистрация</h1>
    <input type="text" placeholder="Логин" autocomplete="username">
    <input type="email" placeholder="Email" autocomplete="email">
    <input type="password" placeholder="Пароль" autocomplete="new-password">
    <button class="submit-btn" type="submit">Зарегистрироваться</button>
    <a class="auth-link" href="login.html">Уже есть аккаунт</a>
  </form>
</main>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация | Anime Stream</title>
  <link rel="stylesheet" href="../public/css/style.css?v=20260616-6">
  <script src="../public/js/register.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-layout">
    <a class="auth-logo" href="index.html">Anime Stream</a>

    <form class="auth-card" id="registerForm">
      <h1>Регистрация</h1>
      <input type="text" name="username" placeholder="Логин" autocomplete="username" required>
      <input type="email" name="email" placeholder="Email" autocomplete="email" required>
      <input type="password" name="password" placeholder="Пароль" autocomplete="new-password" required>
      <button class="submit-btn" type="submit">Зарегистрироваться</button>
      <a class="auth-link" href="login.html">Уже есть аккаунт</a>
    </form>
  </main>
</body>
</html>

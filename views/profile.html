<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль | Anime Stream</title>
  <link rel="stylesheet" href="../public/css/style.css?v=20260616-6">
</head>
<body class="profile-page">

<header>
  <h1>Anime Stream</h1>
  <div class="header-center">
    <nav>
      <a href="index.html">Главная</a>
    </nav>

    <div class="header-actions">
      <a class="profile-btn" href="profile.html" hidden>Профиль</a>
      <a class="logout-btn" href="login.html" hidden>Выход</a>
      <a class="account-btn" href="login.html">Вход</a>
      <a class="register-btn" href="registr.html">Регистрация</a>
    </div>
  </div>
</header>

<main class="profile-layout">
  <section class="profile-hero">
    <div class="profile-avatar" id="profileAvatar">AS</div>
    <div>
      <p class="profile-label">Профиль пользователя</p>
      <h2 id="profileName">Профиль</h2>
      <p class="profile-meta" id="profileMeta">Данные загружаются</p>
    </div>
  </section>

  <section class="profile-stats">
    <button class="profile-stat active" type="button">
      <span id="profileWatchedCount">0</span>
      <p>Просмотрено серий</p>
    </button>
    <button class="profile-stat" type="button">
      <span id="profileProgressCount">0</span>
      <p>В процессе</p>
    </button>
  </section>

  <section class="profile-section" id="profileContinueSection" hidden>
    <h3>Продолжить просмотр</h3>
    <div class="profile-watch-list" id="profileWatchList"></div>
  </section>
</main>

<script src="../public/js/main.js?v=20260616-6"></script>
<script src="../public/js/profile.js"></script>
</body>
</html>
